<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firma YNOY animata</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700&display=swap" rel="stylesheet">
<!--
  Animazione «Powered by YNOY» di Pronti in Tavola (copia fedele del codice dell'app, 09/11/2026).
  Come funziona (spiegazione completa in LEGGIMI.md):
  1) «POWERED BY»: 10 lettere che cadono una dopo l'altra (byDrop, 0,55 s, 40 ms tra una e l'altra).
  2) YNOY scritto a mano: il logo (PNG trasparente, dentro il mask #ylg) si vede solo dove passa la penna:
     22 tratti SVG (path) bianchi in un secondo mask (#ywm); ogni tratto si disegna con stroke-dashoffset
     da --o a 0 (keyframes yStroke), uno dopo l'altro, con il suo ritardo, la sua durata e il suo spessore.
  3) Finito il tratto, il logo pieno (i.y0) compare e un riflesso chiaro lo attraversa (ynoyShine, 0,55 s).
  Tempi: come nell'app ma anticipati di 1,4 s (nell'app prima c'è il logo di Monica). Durata totale ~2,9 s.
-->
<style>
:root { --vino: #7B2318; --carta: #FBF4E8; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Nunito Sans', 'Segoe UI', Roboto, system-ui, sans-serif;
  background: radial-gradient(80% 60% at 50% 40%, #FFFBF3 0%, var(--carta) 55%, #EFDDBF 100%);
  display: flex; align-items: center; justify-content: center; overflow: hidden; }
.scena { --s: min(1, calc(100vw / 760px)); display: flex; flex-direction: column; align-items: center; }
.wall-by { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.wall-by > span { font-size: 2.24rem; letter-spacing: .3em; text-transform: uppercase; font-weight: 700; color: #9A7D66; padding-left: .3em; }
.wall-by em { display: inline-block; font-style: normal; opacity: 0; animation: byDrop .55s cubic-bezier(.3, 1.6, .5, 1) both; }
.wall-by .yn { position: relative; width: min(86vw, 640px); aspect-ratio: 496 / 190; }
.wall-by .yn > i.y0 { position: absolute; inset: 0; opacity: 0;
  background: linear-gradient(100deg, var(--vino) 42%, #FFF1DC 50%, var(--vino) 58%) 100% 0 / 300% 100%;
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
  animation: yShow 0s 2.33s both, ynoyShine .55s 2.33s ease-in-out both; }
.ywr { position: absolute; inset: 0; width: 100%; height: 100%; }
.ywr path { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100 300; animation: yStroke .3s cubic-bezier(.4, .1, .6, .9) both; }
@keyframes byDrop { 0% { opacity: 0; transform: translateY(-26px) rotate(-25deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
@keyframes yStroke { from { stroke-dashoffset: var(--o); } to { stroke-dashoffset: 0; } }
@keyframes yShow { from { opacity: 0; } to { opacity: 1; } }
@keyframes ynoyShine { from { background-position: 100% 0; } to { background-position: 0 0; } }
.ancora { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); border: 0; border-radius: 999px; padding: 10px 18px;
  background: rgba(123, 35, 24, .1); color: var(--vino); font: 700 1rem 'Nunito Sans', system-ui, sans-serif; cursor: pointer; }
.registra .ancora { display: none; }
</style></head>
