# Pubblica il sito su Cloudflare (Worker «pronti-in-tavola») a ogni cambio dell'app.
# Segreti (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  = chiave da «Crea token» del Worker (vale solo per questo sito)
#   CLOUDFLARE_ACCOUNT_ID = ID dell'account Cloudflare «Pronti in Tavola»
#   GROQ_API_KEY          = (facoltativo) chiave di Groq per il ponte dell'aiutante: diventa un segreto del Worker
#   DEEPGRAM_API_KEY      = (facoltativo) chiave di Deepgram per l'ascolto dei clienti (C108): diventa un segreto del Worker
# Senza segreti il giro non pubblica e resta verde.
name: Pubblica sito

on:
  push:
    branches: [claude/pronti-ramo-definitivo]
    paths:
      - '*.js'
      - '*.mjs'
      - '*.html'
      - '*.css'
      - 'manifest.webmanifest'
      - 'media/**'
      - 'tools/sito.py'
      - 'wrangler.jsonc'
      - '.github/workflows/sito.yml'
  workflow_dispatch:

concurrency:
  group: pubblica-sito
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # storia intera: tools/sito.py legge l'ora vera di ogni versione dal git
      - name: Prepara la cartella del sito
        run: python3 tools/sito.py
      - name: Segreti da dare al Worker   # solo i nomi di quelli presenti, uno per riga (wrangler-action li legge da env)
        id: segreti
        run: |
          {
            echo 'lista<<FINE_LISTA'
            if [ -n "$GROQ_API_KEY" ]; then echo GROQ_API_KEY; fi
            if [ -n "$DEEPGRAM_API_KEY" ]; then echo DEEPGRAM_API_KEY; fi
            echo FINE_LISTA
          } >> "$GITHUB_OUTPUT"
      - name: Pubblica su Cloudflare
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
          secrets: ${{ steps.segreti.outputs.lista }}
      - name: Segreti mancanti
        if: env.CF_TOKEN == ''
        run: echo "Manca CLOUDFLARE_API_TOKEN nei segreti di GitHub, niente pubblicazione."
